<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>通讯录 · 我的联系人</title>
    <link rel="stylesheet" href="/api/css/app.css">
</head>
<body>
<header class="topbar">
    <h1>我的联系人</h1>
    <div>
        <button id="refreshBtn" type="button" class="ghost">刷新</button>
        <button id="logoutBtn" type="button" class="ghost">退出登录</button>
    </div>
</header>

<main>
    <form id="addForm" class="inline-form">
        <input id="name"     placeholder="姓名" required>
        <input id="phone"    placeholder="手机号（11 位）" required>
        <input id="landline" placeholder="座机（可空）">
        <button type="submit">新增</button>
    </form>
    <p id="msg" class="msg"></p>

    <table>
        <thead>
        <tr><th>id</th><th>姓名</th><th>手机号</th><th>座机</th><th>操作</th></tr>
        </thead>
        <tbody id="list"></tbody>
    </table>
    <p id="empty" class="hint" hidden>还没有联系人，用上面的表单加一个。</p>
</main>

<script src="/api/js/contacts.js"></script>
</body>
</html>
