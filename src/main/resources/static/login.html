<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>通讯录 · 登录</title>
    <link rel="stylesheet" href="/api/css/app.css">
</head>
<body>
    <form id="loginForm" class="card">
        <h1>通讯录 · 登录</h1>
        <label>用户名<input id="username" username="username" autocomplete="username" required> </label>
        <label>密  码<input id="password" username="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
        <p id="msg" class="msg"></p>
        <p class="hint">还没有账号？<a href="/api/register.html">去注册</a> </p>
    </form>
<script src="/api/js/login.js"></script>
</body>
</html>
